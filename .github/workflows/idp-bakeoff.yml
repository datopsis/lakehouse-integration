name: Identity provider bake-off
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/idp-bakeoff.yml'
      - 'evaluation/idp/**'
      - 'docs/IDP-BAKEOFF.md'
permissions:
  contents: read
concurrency:
  group: idp-bakeoff-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  evaluate:
    name: IdP evaluation (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            machine: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            machine: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      INTEGRATION_ARCH: ${{ matrix.arch }}
      EXPECTED_MACHINE: ${{ matrix.machine }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Native prerequisites and existing hash-locked dependencies
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$EXPECTED_MACHINE"
          df -h
          sudo apt-get update -qq
          sudo apt-get install -y rpm podman gnupg
          python3 -m venv .venv
          .venv/bin/pip install --require-hashes -r requirements.txt
          .venv/bin/ruff check evaluation/idp
          .venv/bin/ruff format --check evaluation/idp
          .venv/bin/zizmor --offline --persona pedantic .github/workflows/idp-bakeoff.yml
      - name: Build unchanged pinned Lakekeeper and PostgreSQL with strict provenance
        id: build
        run: |
          set -euo pipefail
          .venv/bin/python evaluation/idp/run.py build
      - name: Identical TLS and identity assertions
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          .venv/bin/python evaluation/idp/run.py
      - name: Trivy and Grype upstream-image evidence
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          .venv/bin/python evaluation/idp/scans.py
      - name: Remove disposable containers and redact evidence
        id: cleanup
        if: always()
        run: |
          set -euo pipefail
          .venv/bin/python evaluation/idp/common.py
      - name: Retain only sanitized evidence
        if: ${{ !cancelled() && steps.cleanup.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: idp-bakeoff-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/idp/
          retention-days: 14
          if-no-files-found: error
